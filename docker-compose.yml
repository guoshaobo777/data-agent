services:
  mysql:
    image: mysql:8.0
    container_name: data-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/mysql/meta_seed.sql:/docker-entrypoint-initdb.d/meta_seed.sql:ro
      - ./docker/mysql/dw_seed.sql:/docker-entrypoint-initdb.d/dw_seed.sql:ro

  qdrant:
    image: qdrant/qdrant:latest
    container_name: data-agent-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: data-agent-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  mysql_data:
  qdrant_data:
  es_data:

